services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: startup
      POSTGRES_PASSWORD: startup
      POSTGRES_DB: startup_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startup -d startup_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
